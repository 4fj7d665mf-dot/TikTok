name: Build TikTok Username Standalone dylib

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'TikTokUsernameMenu_payload_standalone.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.6.3
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master
          remotelog: false
          libgcuniversal: false
          altlist: false
          comet: false
          orion: false

      - name: Prepare source
        shell: bash
        run: |
          set -euo pipefail

          test -f TikTokUsernameMenu_payload_standalone.zip
          unzip -t TikTokUsernameMenu_payload_standalone.zip

          rm -rf payload _build output
          mkdir -p payload output
          unzip -q TikTokUsernameMenu_payload_standalone.zip -d payload

          git clone --depth 1 https://github.com/xelahot/iOS-Mod-Menu-Base.git _build

          required=(Makefile StandaloneEntry.mm NativeSNS.h NativeSNS.mm SNSFlow.h)
          for f in "${required[@]}"; do
            test -f "payload/$f" || { echo "Missing payload/$f"; exit 1; }
            cp -f "payload/$f" "_build/$f"
          done

      - name: Build standalone dylib
        shell: bash
        run: |
          set -euo pipefail
          cd _build
          make clean
          make FINALPACKAGE=1

      - name: Verify and collect
        shell: bash
        run: |
          set -euo pipefail

          DYLIB_PATH="$(find _build/.theos -type f -name 'TikTokUsernameMenu.dylib' -print -quit)"
          if [[ -z "$DYLIB_PATH" || ! -f "$DYLIB_PATH" ]]; then
            echo 'ERROR: TikTokUsernameMenu.dylib was not produced.'
            find _build/.theos -maxdepth 8 -type f -print || true
            exit 1
          fi

          cp -f "$DYLIB_PATH" output/TikTokUsernameMenu.dylib

          file output/TikTokUsernameMenu.dylib | tee output/file.txt
          lipo -info output/TikTokUsernameMenu.dylib | tee output/lipo.txt || true
          otool -L output/TikTokUsernameMenu.dylib | tee output/otool-L.txt

          if otool -L output/TikTokUsernameMenu.dylib | grep -Eqi 'CydiaSubstrate|MobileSubstrate|libsubstrate'; then
            echo 'ERROR: Standalone dylib still depends on Substrate.'
            exit 1
          fi

          if ! strings -a output/TikTokUsernameMenu.dylib | grep -q 'Xelahot'; then
            echo 'ERROR: Xelahot menu strings are missing.'
            exit 1
          fi

          shasum -a 256 output/TikTokUsernameMenu.dylib > output/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTokUsernameMenu-standalone-dylib
          path: output/
          if-no-files-found: error
